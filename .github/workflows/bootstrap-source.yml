name: Bootstrap Living Benefits source
on:
  push:
    paths:
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install archive decoder
        run: python3 -m pip install --disable-pip-version-check brotli
      - name: Verify archive and restore source files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile, brotli
          root = Path('.')
          parts = [root / 'source-bundle' / f'part-{i:02d}.txt' for i in range(1, 6)]
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          expected = '51d36af001c5b75b7eb9b1d8516b02c83a9cf55d95cee816bbb418fd55d9340b'
          if hashlib.sha256(encoded.encode('ascii')).hexdigest() != expected:
              raise SystemExit('Source bundle integrity check failed; refusing to extract')
          archive = brotli.decompress(base64.b64decode(encoded, validate=True))
          wanted = {
              'server.py', 'web/dashboard.js', 'web/app.css', 'tests/test_v2.py',
              'start_mac.command', 'start_windows.bat', '.gitignore'
          }
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as bundle:
              if set(bundle.getnames()) != wanted:
                  raise SystemExit('Unexpected files found in source archive')
              for member in bundle.getmembers():
                  if not member.isfile() or member.name not in wanted:
                      raise SystemExit('Unsafe source archive entry')
                  target = root / member.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.extractfile(member).read())
          print('Restored', len(wanted), 'source files; verified archive integrity')
          PY
      - name: Commit complete source tree and remove temporary bootstrap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py web/dashboard.js web/app.css tests/test_v2.py start_mac.command start_windows.bat .gitignore
          git rm -r source-bundle .github/workflows/bootstrap-source.yml
          git commit -m "Complete Living Benefits Survey V2 source tree"
          git push origin HEAD:main
